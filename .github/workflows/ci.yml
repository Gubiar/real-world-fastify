name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastify_test
      - run: pnpm exec jest --forceExit
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastify_test
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-testing-only
          RUN_MIGRATIONS_ON_STARTUP: 'false'
          RATE_LIMIT_MAX: '10000'
          RATE_LIMIT_AUTH_MAX: '10000'

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod

  docker:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: ci_db
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose (secure stack)
        run: docker compose --profile app -f docker-compose.yml config >/dev/null
      - name: Validate Compose (development override)
        run: docker compose --profile app -f docker-compose.yml -f docker-compose.development.yml config >/dev/null
      - uses: docker/setup-buildx-action@v3
      - name: Build application image
        run: docker build -t fastify-auth-boilerplate:ci .
